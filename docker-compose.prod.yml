services:
  # PostgreSQL Database - NOT exposed to host
  postgres:
    image: postgres:16
    container_name: marketing-agent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketing_agents}
      POSTGRES_USER: ${POSTGRES_USER:-marketing_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketing_user} -d ${POSTGRES_DB:-marketing_agents}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis Cache & Queue - NOT exposed to host
  redis:
    image: redis:7-alpine
    container_name: marketing-agent-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketing-agent-backend
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-marketing_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketing_agents}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - LOCAL_STORAGE_PATH=/app/storage
      - DEBUG=false
      - ENVIRONMENT=production
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped

  # Celery Worker (Task Queue)
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketing-agent-celery
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-marketing_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marketing_agents}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - LOCAL_STORAGE_PATH=/app/storage
      - DEBUG=false
      - ENVIRONMENT=production
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped

  # Frontend (React) - production build served by nginx
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: marketing-agent-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_data:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
    restart: unless-stopped

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: marketing-agent-certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:
  backend_storage:
  certbot_data:
  certbot_www:
